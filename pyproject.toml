[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drive-rescue"
version = "1.0.0"
description = "Zero-Freeze Raw Physical Drive & NTFS Live File Recovery Engine for Windows"
readme = "README.md"
authors = [{ name = "Drive Rescue Contributors", email = "support@drive-rescue.dev" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Topic :: System :: Recovery Tools",
    "Topic :: System :: Filesystems",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["data-recovery", "bad-sectors", "ntfs", "raw-disk", "forensics", "ddrescue", "direct-io"]
requires-python = ">=3.8"
dependencies = []

[project.scripts]
drive-recovery = "main:main"
drive-rescue = "main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["drive_rescue*", "skills*"]
exclude = ["tests*", "tools*"]

[tool.setuptools.package-data]
drive_rescue = ["contract/schemas/*.json"]
skills = ["*/*.json", "*/*.py"]
"*" = ["dashboard.html", "*.png", "*.ico", "*.md", "*.bat", "*.sh"]

[metadata]
name = drive-rescue
version = 1.0.0
description = Zero-Freeze, Non-Destructive Raw Physical Drive & NTFS Live File Recovery Engine
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
classifiers =
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.8
zip_safe = False
include_package_data = True

[options.packages.find]
where = .
include =
    drive_rescue*
    skills*
exclude =
    tests*
    tools*

[options.package_data]
drive_rescue = contract/schemas/*.json
skills = */*.json, */*.py
* = dashboard.html, *.png, *.ico, *.md, *.bat, *.sh

[options.extras_require]
test =
    build
    wheel
    setuptools
dev =
    build
    wheel
    setuptools

[options.entry_points]
console_scripts =
    drive-rescue = main:main
    drive-recovery = main:main

name: Skills & Contract CI

on:
  push:
    branches: [ main, package-refactor-ci ]
    paths:
      - 'skills/**'
      - 'drive_rescue/contract/**'
      - 'drive_rescue/registry/**'
      - 'drive_rescue/runtime/**'
      - 'tests/**'
      - '.github/workflows/skills-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'skills/**'
      - 'drive_rescue/contract/**'
      - 'drive_rescue/registry/**'
      - 'drive_rescue/runtime/**'
      - 'tests/**'
      - '.github/workflows/skills-ci.yml'

jobs:
  conformance:
    name: Contract Conformance & Resiliency Matrix (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies & Package
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Strict Manifest & Schema Conformance Check
        run: |
          python tools/validate_manifests.py

      - name: Verify Packaged Skill Imports
        run: |
          python3 -c "
          import skills.repair_corrupted_files.skill
          import skills.smart_sorter_reorganizer.skill
          print('Packaged skills imported successfully!')
          "

      - name: Run Contract Conformance Tests
        run: |
          python -m unittest tests.test_skill_conformance -v

      - name: Run Circuit Breaker & Fallback Tests
        run: |
          python -m unittest tests.test_circuit_breaker -v

      - name: Run Dynamic Registry & Canary Tests
        run: |
          python -m unittest tests.test_skill_registry -v

      - name: Run End-to-End Isolated Process Smoke Tests
        run: |
          python -m unittest tests.test_e2e_smoke -v

      - name: Run Core Test Suite & QA Benchmark
        run: |
          python -m unittest tests.test_suite -v
          python tests/qa_benchmark.py

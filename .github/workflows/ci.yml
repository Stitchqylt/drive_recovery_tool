# CI workflow: run unit tests and build package on pushes and PRs
name: CI

on:
  push:
    branches: [ main, package-refactor-ci ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tools and package
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          pip install -e .
      - name: Run unit and contract tests
        run: |
          python -m unittest discover tests/ -v
      - name: Run QA Benchmark
        run: |
          python tests/qa_benchmark.py
      - name: Build wheel and source dist
        run: |
          python -m build
